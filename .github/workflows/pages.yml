name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm ci
      - name: Build for GitHub Pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # configure-pages returns "/easy-chinese" (no trailing slash).
          # Vite preserves that exact base in import.meta.env.BASE_URL.
          base_path="${PAGES_BASE_PATH:-/}"
          base_path="${base_path%/}/"
          npm run build -- --base "$base_path"
          # Fail deployment if the stroke files needed by the copybook are absent.
          test -f dist/hanzi/4e00.json
          test -f dist/hanzi/4eba.json
      - name: Add the browser router fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deployment
