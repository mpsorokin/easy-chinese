name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json # engines.node
          cache: npm
      - run: npm ci
      # lint, prettier, typecheck, tests (pretest generates stroke data)
      - run: npm run check
      - run: npm run build
